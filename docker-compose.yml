services:
  postgres:
    image: postgres:16-alpine
    container_name: curator-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: curator_ai
    ports:
      - "5432:5432"
    volumes:
      - curator_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: curator-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - curator_ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  curator_ai_postgres_data:
  curator_ai_redis_data:
